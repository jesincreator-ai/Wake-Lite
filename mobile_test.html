<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wake Lite</title><style>body{font:16px system-ui;background:#101820;color:#eee;padding:16px}input,button{font:inherit;padding:11px;margin:4px;border-radius:9px}button{background:#67dca0;border:0}pre{background:#22303b;padding:12px}</style><h1>Wake Lite</h1><p>Wake phrase</p><input id="wake" value="Hey BILLI"><input id="spoken" placeholder="Try: Hey BILLI"><button onclick="detect()">Check</button><button onclick="mic()">Mic</button><pre id="out">sleep state</pre><script>function detect(){out.textContent=spoken.value.toLowerCase().includes(wake.value.toLowerCase())?'Wake detected · awake':'No match · sleep'}function mic(){let S=SpeechRecognition||webkitSpeechRecognition;if(!S){out.textContent='Browser speech recognition unavailable';return}let r=new S();r.lang='en-US';r.onresult=e=>{spoken.value=e.results[0][0].transcript;detect()};r.onerror=e=>out.textContent='Mic error '+e.error;r.start()}</script></html>
